name: Pages

on:
  push:
    branches: [develop]
    paths: [site/**, .github/workflows/pages.yaml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publica a landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configura o Pages
        uses: actions/configure-pages@v6

      - name: Empacota o site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publica
        id: deploy
        uses: actions/deploy-pages@v5
