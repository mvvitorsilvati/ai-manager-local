name: QA

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, ruff, pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Testes (pytest + cobertura)
        run: uv run --no-sync pytest

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Type check (pyright)
        run: uv run --no-sync pyright

  frontend:
    name: Frontend (vitest, build, oxlint, oxfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Testes (vitest)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Formatação (oxfmt)
        run: pnpm format:check

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E
        run: pnpm test:e2e

      - name: Artifacts das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7

  docker:
    name: Docker (imagem sobe e responde)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: |
          IMAGE="localhost/ai-manager-local-py-3.14:$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -n 1)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --pull -t "$IMAGE" .

      - name: Confere isolamento da imagem de produção
        run: |
          docker run --rm "$IMAGE" /app/backend/.venv/bin/python -c '
          import importlib.util
          import os
          from pathlib import Path
          assert os.geteuid() == 10001, "Runtime deve executar como usuário sem privilégio"
          for name in ("pytest", "pytest_cov", "xdist", "pyright", "ruff", "nodeenv"):
              assert importlib.util.find_spec(name) is None, f"Dependência dev no runtime: {name}"
          for name in ("uv", "uvx"):
              assert not Path(f"/usr/bin/{name}").exists(), f"Instalador no runtime: {name}"
          '
          docker run --rm --user 0 "$IMAGE" /usr/local/bin/python -c '
          import importlib.util
          from pathlib import Path
          for name in ("pip", "ensurepip"):
              assert importlib.util.find_spec(name) is None, f"Instalador Python no runtime: {name}"
          assert not Path("/root/.cache/uv").exists(), "Cache de build no runtime"
          '

      - name: Sobe o container e confere a API
        run: |
          docker run -d --name aim-smoke -p 127.0.0.1:4799:4747 \
            -e HOME=/tmp/host-home "$IMAGE"
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:4799/api/catalog; then
              echo "GET /api/catalog respondeu 200"
              docker rm -f aim-smoke
              exit 0
            fi
            sleep 2
          done
          echo "API não respondeu; logs do container:"
          docker logs aim-smoke
          docker rm -f aim-smoke
          exit 1
