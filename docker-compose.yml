name: ai-management-local

services:
  app:
    image: localhost/ai-management-local-py-3.14:0.1.0
    build: .
    ports:
      # publica só no loopback do host; dentro do container a API escuta em 0.0.0.0
      - "127.0.0.1:4747:4747"
    environment:
      # o HOME do container aponta para o home montado (fontes, backups e audit)
      HOME: /host-home
      AIM_HOST: 0.0.0.0
    volumes:
      - ${HOME}:/host-home
    restart: unless-stopped
