name: ai-manager-local

services:
  app:
    # tag no padrão do time; acompanha o bump de versão (sobrescreva com AIM_VERSION=<versão>)
    image: localhost/ai-manager-local-py-3.14:${AIM_VERSION:-2.0.3}
    build: .
    ports:
      # publica só no loopback do host; dentro do container a API escuta em 0.0.0.0
      - "127.0.0.1:4747:4747"
    environment:
      # o HOME do container aponta para o home montado (fontes, backups e audit)
      HOME: /host-home
      AIM_HOST: 0.0.0.0
      # Instalação do statusline no container (padrão: "none" - não fazer nada):
      # Opções: "none" (padrão), "both", "claude", "antigravity"
      AIM_STATUSLINE_INSTALL: "none"
      # WSL com as IAs no Windows: aponte o AIM_HOME para o perfil montado abaixo
      # AIM_HOME: /host-windows
    volumes:
      - ${HOME}:/host-home
      # WSL com as IAs no Windows: descomente e ajuste o usuário
      # - /mnt/c/Users/<você>:/host-windows
    restart: unless-stopped
