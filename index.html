<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor Local</title>
<link rel="icon" href="data:,">
<script async src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" onload="window.__mermaidOnload && window.__mermaidOnload()"></script>
<style>
:root{
  --bg:#0d1117; --panel:#11161d; --panel2:#151c26; --border:#232c39;
  --text:#e6ebf2; --muted:#8b98ad; --accent:#6ea8fe; --ok:#8ce99a; --warn:#ffd43b;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{display:flex;height:100vh}
aside{width:264px;flex:none;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
.brand{padding:18px 18px 12px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--ok))}
nav{padding:6px 10px;overflow:auto;flex:1}
.navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;user-select:none}
.navitem:hover{background:var(--panel2);color:var(--text)}
.navitem.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.navitem em{font-style:normal;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:1px 7px;border-radius:999px}
.foot{padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.foot div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
#search{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:6px 10px;font-size:15px;line-height:1}
.chip{border-radius:999px;padding:6px 14px}
.chip-on{border-color:var(--accent);color:var(--accent)}
#view{flex:1;overflow:auto;padding:22px 26px}
h2.vt{margin:0 0 4px;font-size:18px}
.sub{color:var(--muted);margin:0 0 20px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 14px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .d{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.card .p{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);vertical-align:middle}
.badge.dis{opacity:.5}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{margin:22px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left}
table.t th{color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .12s}
.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.rec{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.rec:hover{color:var(--accent)}
.rec .rp{color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.src{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--panel)}
details.src>summary{padding:8px 12px;cursor:pointer;font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:hover{color:var(--accent)}
details.src>summary:before{content:"▸ ";color:var(--muted)}
details.src[open]>summary:before{content:"▾ "}
details.tnode{border:0;background:transparent;margin:0}
details.tnode>summary{padding:4px 8px;cursor:pointer;font-size:12px;font-family:var(--mono);list-style:none;border-radius:6px}
details.tnode>summary:hover{background:var(--panel2);color:var(--text)}
details.tnode>summary:before{content:"▸ ";color:var(--muted);font-size:9px}
details.tnode[open]>summary:before{content:"▾ "}
details summary em{font-style:normal;color:var(--muted);font-size:11px}
.tbody{padding:2px 12px 8px 24px}
details.tnode>.tbody{border-left:1px solid var(--border);margin:0 0 2px 10px;padding:0 0 0 8px}
.treebox{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:9px 12px 10px}
.filerow{display:flex;align-items:center;gap:6px;padding:3px 8px;color:var(--text);text-decoration:none;font-size:12.5px;cursor:pointer;font-family:var(--mono);border-radius:6px}
.filerow:hover{background:var(--panel2);color:var(--accent)}
.filerow .cat{color:var(--muted);font-family:inherit;font-size:10.5px;margin-left:2px;flex:none}
.ico{width:14px;height:14px;flex:none;opacity:.75}
.navlabel{display:flex;align-items:center;gap:9px}
.navlabel .ico{width:15px;height:15px}
details.src>summary .ico,details.tnode>summary .ico{display:inline-block;margin-right:6px;vertical-align:-2px}
.tbody .filerow{margin-left:14px}
#drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;z-index:40}
#drawer.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:relative;width:min(960px,100%);background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100%}
.dhead{display:flex;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.dhead .n{font-weight:700}
.dhead .p{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.actions{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.fmeta{display:flex;gap:8px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.content{overflow:auto;padding:20px 24px 60px}
.content pre{background:#0a0e13;border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.content pre code{font-family:inherit}
.content pre.raw{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.content pre.fm{background:var(--panel2);color:var(--muted);border-style:dashed;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{margin:22px 0 8px;line-height:1.3}
.md h1{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:6px}
.md h2{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:5px}
.md h3{font-size:15.5px}
.md p{margin:9px 0}
.md code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:12px}
.md a{color:var(--accent)}
.md blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:2px 14px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.md ul,.md ol{margin:8px 0;padding-left:26px}
.md li{margin:3px 0}
.md table{border-collapse:collapse;margin:12px 0;width:100%;font-size:12.5px}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md th{background:var(--panel2)}
.mermaid{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;margin:12px 0;text-align:center}
.mermaid svg{max-width:100%;height:auto}
.preview{max-width:100%;max-height:70vh;border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:8px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.hit{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:2px 0;white-space:pre-wrap;word-break:break-all}
.hit b{color:var(--warn);font-weight:600}
.tbody .hit{margin-left:20px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span> Gestor Local</div>
    <nav id="nav"></nav>
    <div class="foot" id="roots"></div>
  </aside>
  <main>
    <header>
      <input id="search" type="search" placeholder="Buscar por nome ou conteúdo (mín. 2 letras)…" autocomplete="off">
      <button id="refresh" class="btn">Atualizar</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="drawer" class="hidden">
  <div class="backdrop" id="backdrop"></div>
  <div class="panel">
    <div class="dhead">
      <div>
        <div class="n" id="fname"></div>
        <div class="p" id="fpath"></div>
      </div>
      <div class="actions">
        <button class="btn" id="btn-render">Render</button>
        <button class="btn" id="btn-raw">Raw</button>
        <button class="btn" id="btn-copy">Copiar caminho</button>
        <button class="btn" id="btn-reveal">Finder</button>
        <button class="btn icon" id="btn-close">×</button>
      </div>
    </div>
    <div class="fmeta" id="fmeta"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SRC_COLOR = {opencode:"#6ea8fe", agents:"#f783ac", claude:"#d0a2ff", codex:"#8ce99a", gemini:"#ffd43b"};
const CAT_LABEL = {context:"contexto", skill:"skill", agent:"agente", command:"comando", rule:"regra", config:"config", doc:"doc", script:"script", image:"imagem"};
const ICON = (p) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  dashboard: ICON('<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>'),
  tools: ICON('<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>'),
  context: ICON('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),
  skill: ICON('<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>'),
  agent: ICON('<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>'),
  command: ICON('<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>'),
  rule: ICON('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'),
  config: ICON('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
  doc: ICON('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/>'),
  script: ICON('<path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/>'),
  image: ICON('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>'),
  folder: ICON('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'),
  file: ICON('<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/>'),
  mcp: ICON('<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>'),
  plugin: ICON('<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>'),
};
ICONS.projetos = ICONS.folder;
ICONS.files = ICONS.doc;
const fileIcon = (c) => ICONS[c] || ICONS.file;
const isDoc = (f) => f.r.split("/").includes("docs");
const RENDERABLE = /\.(md|markdown|jsonc?|png|jpe?g|gif|webp|ico|svg)$/i;

const state = {catalog:null, sources:{}, files:[], byDir:new Map(), view:"dashboard", cat:null, lastView:"dashboard", query:"", results:[], open:null, mode:"render"};

function ago(ts){
  const d = ts*1000 - Date.now(), abs = Math.abs(d);
  const steps = [["year",31536e6],["month",2592e6],["day",864e5],["hour",36e5],["minute",6e4],["second",1000]];
  for (const [u,ms] of steps){ if (abs >= ms) return new Intl.RelativeTimeFormat("pt-BR",{numeric:"auto"}).format(Math.round(d/ms),u); }
  return "agora";
}
const fmtBytes = (n) => n < 1024 ? n+" B" : n < 1048576 ? (n/1024).toFixed(1)+" KB" : (n/1048576).toFixed(1)+" MB";
const fmtDT = (ms) => new Intl.DateTimeFormat("pt-BR", {dateStyle:"short", timeStyle:"short"}).format(new Date(ms));
const metaWhen = (label, ts) => `<span title="${new Date(ts*1000).toISOString()}">${label}: ${fmtDT(ts*1000)}</span>`;
const baseName = (p) => String(p).split("/").pop();
const srcBadge = (id) => `<span class="badge" style="border-color:${SRC_COLOR[id]||"#8b98ad"};color:${SRC_COLOR[id]||"#8b98ad"}">${esc(state.sources[id]?.label || id)}</span>`;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}

async function loadCatalog(){
  const catalog = await (await fetch("/api/catalog")).json();
  state.catalog = catalog;
  state.sources = Object.fromEntries(catalog.sources.map((s) => [s.id, s]));
  state.files = catalog.files;
  state.fileIndex = new Map(catalog.files.map((f, i) => [f.s + "|" + f.r, i]));
  renderNav();
  render();
}

function counts(){
  const c = {context:0, skill:0, agent:0, command:0, rule:0, config:0, doc:0, script:0};
  for (const f of state.files) c[f.c] = (c[f.c]||0)+1;
  return c;
}

function renderNav(){
  const c = counts();
  const items = [
    ["dashboard","Visão geral", null],
    ["tools","Por IA", (state.catalog.tools||[]).length],
    ["context","Contextos", c.context],
    ["skill","Skills", state.catalog.skills.length],
    ["agent","Agentes", c.agent],
    ["command","Comandos", c.command],
    ["rule","Regras", c.rule],
    ["docs","Docs", state.files.filter(isDoc).length],
    ["mcp","MCPs", state.catalog.mcps.length],
    ["plugin","Plugins", state.catalog.plugins.length],
    ["projetos","Projetos", (state.catalog.projects||[]).length],
    ["files","Arquivos", state.files.length],
  ];
  $("#nav").innerHTML = items.map(([id,label,n]) =>
    `<div class="navitem ${state.view===id||state.cat===id?"active":""}" data-nav="${id}"><span class="navlabel">${ICONS[id]||ICONS.file}${label}</span>${n!=null?`<em>${n}</em>`:""}</div>`
  ).join("");
  $("#roots").innerHTML = state.catalog.sources.filter((s)=>!s.project).map((s) => `<div title="${esc(s.root)}">${esc(s.label)}</div>`).join("");
}

function render(){
  const view = state.view;
  const el = $("#view");
  if (view === "dashboard") el.innerHTML = viewDashboard();
  else if (view === "tools") el.innerHTML = viewTools();
  else if (view === "files") el.innerHTML = viewFiles();
  else if (view === "projetos") el.innerHTML = viewProjects();
  else if (view === "docs") el.innerHTML = viewDocs();
  else if (view === "mcp") el.innerHTML = viewMcps();
  else if (view === "plugin") el.innerHTML = viewPlugins();
  else if (view === "search") el.innerHTML = viewSearch();
  else el.innerHTML = viewCategory(view);
  el.scrollTop = 0;
}

function pushHistory(){
  history.pushState({
    view: state.view, cat: state.cat,
    file: state.open ? {s: state.open.s, r: state.open.r, name: state.open.name} : null,
  }, "");
}

function closeDrawer(){
  if (state.open && history.state && history.state.file) history.back();
  else { state.open = null; $("#drawer").classList.add("hidden"); }
}

window.addEventListener("popstate", (e) => {
  const st = e.state || {view: "dashboard", cat: null, file: null};
  const changed = st.view !== state.view || st.cat !== state.cat;
  state.view = st.view;
  state.cat = st.cat;
  if (st.file){
    const cur = state.open;
    if (!cur || cur.s !== st.file.s || cur.r !== st.file.r) openFile(st.file.s, st.file.r, st.file.name, {push: false});
    if (changed){ renderNav(); render(); }
  } else {
    state.open = null;
    $("#drawer").classList.add("hidden");
    if (changed){ renderNav(); render(); }
  }
});

function go(v, cat){
  state.view = v;
  state.cat = ["dashboard","tools","files","mcp","plugin","docs","search"].includes(v) ? null : v;
  if (v !== "search") { state.query = ""; $("#search").value = ""; }
  state.lastView = v;
  renderNav(); render();
  pushHistory();
}

function viewDashboard(){
  const c = counts();
  const mcps = state.catalog.mcps.length, plugins = state.catalog.plugins.length;
  const stats = [
    ["Por IA",(state.catalog.tools||[]).length,"tools"],
    ["Contextos",c.context,"context"],
    ["Skills",state.catalog.skills.length,"skill"],
    ["Agentes",c.agent,"agent"],
    ["Comandos",c.command,"command"],
    ["Regras",c.rule,"rule"],
    ["Docs",state.files.filter(isDoc).length,"docs"],
    ["MCPs",mcps,"mcp"],
    ["Plugins",plugins,"plugin"],
    ["Projetos",(state.catalog.projects||[]).length,"projetos"],
    ["Arquivos",state.files.length,"files"],
  ];
  let h = `<h2 class="vt">Visão geral</h2><p class="sub">Configurações locais das IAs neste Mac — somente leitura.</p>`;
  h += `<div class="stats">${stats.map(([l,n,v])=>`<div class="stat" data-nav="${v}" title="Abrir ${l}"><b>${n}</b><span>${l}</span></div>`).join("")}</div>`;
  h += `<div class="sec">Fontes</div><table class="t"><tr><th>Fonte</th><th>Caminho</th><th>Arquivos</th><th>Skills</th></tr>`;
  for (const s of state.catalog.sources.filter((x)=>!x.project)){
    const fs = state.files.filter((f)=>f.s===s.id).length;
    const sk = state.catalog.skills.filter((f)=>f.s===s.id).length;
    h += `<tr><td>${srcBadge(s.id)}</td><td style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">${esc(s.root)}</td><td>${fs}</td><td>${sk}</td></tr>`;
  }
  h += `</table>`;
  const recent = [...state.files].sort((a,b)=>b.t-a.t).slice(0,10);
  h += `<div class="sec">Modificados recentemente</div>`;
  h += recent.map((f)=>{
    const i = state.files.indexOf(f);
    return `<div class="rec" data-ref="file:${i}"><span>${esc(f.n)} <span class="badge">${CAT_LABEL[f.c]||f.c}</span></span><span class="rp">${esc(f.r)} · ${ago(f.t)}</span></div>`;
  }).join("");
  return h;
}

function viewCategory(){
  const cat = state.cat;
  if (cat === "skill") return viewSkills();
  const items = state.files.filter((f)=>f.c===cat);
  const bySrc = new Map();
  for (const f of items){ if(!bySrc.has(f.s)) bySrc.set(f.s,[]); bySrc.get(f.s).push(f); }
  let h = `<h2 class="vt">${CAT_LABEL[cat] ? CAT_LABEL[cat].replace(/^./, (m)=>m.toUpperCase()) + "s" : cat}</h2><p class="sub">${items.length} arquivo(s)</p>`;
  for (const [sid, list] of bySrc){
    const entries = list.map((f)=>({f, i: state.fileIndex.get(f.s+"|"+f.r)}));
    h += `<div class="sec">${srcBadge(sid)} <span style="color:var(--muted)">${list.length}</span></div><div class="treebox">${treeFromFiles(entries)}</div>`;
  }
  return h;
}

function viewSkills(){
  const bySrc = new Map();
  for (const s of state.catalog.skills){ if(!bySrc.has(s.s)) bySrc.set(s.s,[]); bySrc.get(s.s).push(s); }
  let h = `<h2 class="vt">Skills</h2><p class="sub">${state.catalog.skills.length} skills — exibindo todos os arquivos dos diretórios</p>`;
  for (const [sid, list] of bySrc){
    const srcFiles = state.files.map((f,i)=>({f,i})).filter((e)=>e.f.s===sid);
    const entries = [];
    for (const s of list){
      const skillIdx = state.catalog.skills.indexOf(s);
      const dir = s.r.includes("/") ? s.r.slice(0, s.r.lastIndexOf("/")) : "";
      const prefix = dir ? dir + "/" : "";
      for (const e of srcFiles){
        const own = e.f.r === s.r;
        if (!own && !(prefix && e.f.r.startsWith(prefix))) continue;
        entries.push(own
          ? {f: e.f, ref: `skill:${skillIdx}`, label: s.skill_name, title: s.description || ""}
          : {f: e.f, i: e.i});
      }
    }
    h += `<div class="sec">${srcBadge(sid)} <span style="color:var(--muted)">${list.length} skills · ${entries.length} arquivos</span></div><div class="treebox">${treeFromFiles(entries)}</div>`;
  }
  return h;
}

function viewMcps(){
  const bySrc = new Map();
  for (const m of state.catalog.mcps){ if(!bySrc.has(m.source)) bySrc.set(m.source,[]); bySrc.get(m.source).push(m); }
  let h = `<h2 class="vt">MCPs</h2><p class="sub">${state.catalog.mcps.length} servidores configurados</p>`;
  for (const [sid, list] of bySrc){
    h += `<div class="sec">${srcBadge(sid)}</div><div class="grid">`;
    for (const m of list){
      h += `<div class="card"><div class="rowline"><span class="t">${esc(m.name)}</span><span class="badge">${esc(m.type||"")}</span>${m.scope?`<span class="badge">${esc(m.scope)}</span>`:""}<span class="badge ${m.enabled?"":"dis"}">${m.enabled?"ativo":"inativo"}</span></div><div class="d" style="margin-top:6px">${esc(m.detail||"—")}</div></div>`;
    }
    h += `</div>`;
  }
  return h;
}

function viewPlugins(){
  const bySrc = new Map();
  for (const p of state.catalog.plugins){ if(!bySrc.has(p.source)) bySrc.set(p.source,[]); bySrc.get(p.source).push(p); }
  let h = `<h2 class="vt">Plugins</h2><p class="sub">${state.catalog.plugins.length} plugins/marketplaces</p>`;
  for (const [sid, list] of bySrc){
    h += `<div class="sec">${srcBadge(sid)}</div><div class="grid">`;
    for (const p of list){
      h += `<div class="card"><div class="rowline"><span class="t">${esc(p.name)}</span>${p.scope?`<span class="badge">${esc(p.scope)}</span>`:""}<span class="badge ${p.enabled?"":"dis"}">${p.enabled?"ativo":"inativo"}</span></div>${p.detail?`<div class="d" style="margin-top:6px">${esc(p.detail)}</div>`:""}</div>`;
    }
    h += `</div>`;
  }
  return h;
}

function treeFromFiles(entries){
  const root = {dirs:new Map(), files:[]};
  for (const e of entries){
    const f = e.f;
    const parts = (f.r || f.n).split("/");
    let node = root;
    for (let k = 0; k < parts.length-1; k++){
      let next = node.dirs.get(parts[k]);
      if (!next){ next = {dirs:new Map(), files:[]}; node.dirs.set(parts[k], next); }
      node = next;
    }
    node.files.push(e);
  }
  const count = (node) => node.files.length + [...node.dirs.values()].reduce((acc,c)=>acc+count(c),0);
  const html = (node) => {
    let h = "";
    for (const [name, child] of [...node.dirs.entries()].sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"))){
      h += `<details class="tnode"><summary>${ICONS.folder}${esc(name)} <em>${count(child)}</em></summary><div class="tbody">${html(child)}</div></details>`;
    }
    for (const e of node.files.sort((a,b)=>(a.label||a.f.n).localeCompare(b.label||b.f.n,"pt-BR"))){
      const ref = e.ref || ("file:"+e.i);
      h += `<a class="filerow" data-ref="${ref}"${e.title?` title="${esc(e.title)}"`:""}>${fileIcon(e.f.c)}${esc(e.label||e.f.n)}<span class="cat">${CAT_LABEL[e.f.c]||e.f.c}</span></a>${e.extra||""}`;
    }
    return h;
  };
  return html(root);
}

function viewFiles(){
  let h = `<h2 class="vt">Arquivos</h2><p class="sub">${state.files.length} arquivos indexados (somente texto/config)</p>`;
  for (const s of state.catalog.sources){
    const entries = state.files.map((f,i)=>({f,i})).filter((e)=>e.f.s===s.id);
    if (!entries.length) continue;
    h += `<details class="src"><summary>${esc(s.label)} <em>${entries.length}</em></summary><div class="tbody" style="padding:4px 10px 10px">${treeFromFiles(entries)}</div></details>`;
  }
  return h;
}

function viewProjects(){
  const ps = state.catalog.projects || [];
  let h = `<h2 class="vt">Projetos</h2><p class="sub">${ps.length} projeto(s) com configuração de IA em ~/Projetos</p>`;
  if (!ps.length) return h + `<p class="sub">Nenhuma configuração de IA encontrada nos projetos.</p>`;
  for (const p of ps){
    const entries = state.files.map((f,i)=>({f,i})).filter((e)=>e.f.s===p.id);
    h += `<details class="src"><summary><b>${esc(p.name)}</b> <em>${entries.length} arquivo(s)</em> <span style="color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px">${esc(p.rel)}</span></summary><div class="tbody" style="padding:4px 10px 10px">${treeFromFiles(entries)}</div></details>`;
  }
  return h;
}

function viewDocs(){
  const docs = state.files.map((f,i)=>({f,i})).filter((e)=>isDoc(e.f));
  let h = `<h2 class="vt">Docs</h2><p class="sub">${docs.length} arquivo(s) de documentação (pastas docs/ globais e dos projetos)</p>`;
  if (!docs.length) return h;
  const bySrc = new Map();
  for (const e of docs){ if(!bySrc.has(e.f.s)) bySrc.set(e.f.s,[]); bySrc.get(e.f.s).push(e); }
  const sections = [...bySrc.entries()].sort((a,b)=>{
    const A = state.sources[a[0]] || {}, B = state.sources[b[0]] || {};
    return (Number(!!A.project)-Number(!!B.project)) || String(A.label||"").localeCompare(String(B.label||""),"pt-BR");
  });
  for (const [sid, list] of sections){
    const s = state.sources[sid] || {};
    h += `<div class="sec">${s.project ? `Projeto · <b style="color:var(--text)">${esc(s.label)}</b>` : srcBadge(sid)} <span style="color:var(--muted)">${list.length}</span></div><div class="treebox">${treeFromFiles(list)}</div>`;
  }
  return h;
}

function viewTools(){
  const tools = state.catalog.tools || [];
  if (!tools.length) return `<h2 class="vt">Por IA</h2><p class="sub">Nenhuma configuração por ferramenta encontrada.</p>`;
  if (!state.tool || !tools.some((t)=>t.id===state.tool)) state.tool = tools[0].id;
  let h = `<h2 class="vt">Por IA</h2><p class="sub">Escolha a ferramenta para ver as configurações globais e por projeto</p>`;
  h += `<div class="rowline" style="margin-bottom:18px">`;
  for (const t of tools){
    const n = state.files.filter((f)=>f.k===t.id).length;
    h += `<button class="btn chip ${state.tool===t.id?"chip-on":""}" data-tool="${esc(t.id)}">${esc(t.label)} <span style="color:var(--muted);margin-left:4px">${n}</span></button>`;
  }
  h += `</div>`;
  const files = state.files.filter((f)=>f.k===state.tool);
  const bySrc = new Map();
  for (const f of files){ if(!bySrc.has(f.s)) bySrc.set(f.s,[]); bySrc.get(f.s).push(f); }
  const sections = [...bySrc.entries()].sort((a,b)=>{
    const A = state.sources[a[0]] || {}, B = state.sources[b[0]] || {};
    return (Number(!!A.project)-Number(!!B.project)) || String(A.label||"").localeCompare(String(B.label||""),"pt-BR");
  });
  for (const [sid, list] of sections){
    const s = state.sources[sid] || {};
    const entries = state.files.map((f,i)=>({f,i})).filter((e)=>e.f.s===sid && e.f.k===state.tool);
    h += `<div class="sec">${s.project ? `Projeto · <b style="color:var(--text)">${esc(s.label)}</b>` : srcBadge(sid)} <span style="color:var(--muted)">${entries.length}</span></div><div class="treebox">${treeFromFiles(entries)}</div>`;
  }
  return h;
}

function viewSearch(){
  if (!state.results.length) return `<h2 class="vt">Busca</h2><p class="sub">Nenhum resultado para “${esc(state.query)}”.</p>`;
  let h = `<h2 class="vt">Busca</h2><p class="sub">${state.results.length} arquivo(s) para “${esc(state.query)}”</p>`;
  const re = new RegExp("("+state.query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  const bySrc = new Map();
  state.results.forEach((r, i) => { if(!bySrc.has(r.s)) bySrc.set(r.s,[]); bySrc.get(r.s).push({r, i}); });
  for (const [sid, list] of bySrc){
    const entries = list.map(({r, i})=>({
      f: r, ref: "sr:"+i,
      extra: r.matches.map((m)=>`<div class="hit">${m.n}: ${esc(m.text).replace(re,"<b>$1</b>")}</div>`).join(""),
    }));
    h += `<div class="sec">${srcBadge(sid)} <span style="color:var(--muted)">${list.length}</span></div><div class="treebox">${treeFromFiles(entries)}</div>`;
  }
  return h;
}

async function openFile(s, r, name, opts){
  try{
    const res = await fetch(`/api/file?s=${encodeURIComponent(s)}&r=${encodeURIComponent(r)}`);
    const data = await res.json();
    if (!res.ok) { toast(data.error || "Erro ao abrir"); return; }
    state.open = {s, r, name: name || baseName(r), ...data};
    state.mode = RENDERABLE.test(r) ? "render" : "raw";
    renderDrawer();
    if (!opts || opts.push !== false) pushHistory();
  } catch(e){ toast("Erro ao abrir arquivo"); }
}

function initMermaid(){
  if (!window.mermaid || window.__mermaidInit) return;
  try{
    window.mermaid.initialize({startOnLoad:false, theme:"dark", securityLevel:"strict"});
    window.__mermaidInit = true;
  }catch(e){ console.warn("mermaid init indisponível", e); }
}

async function renderMermaid(){
  initMermaid();
  if (!window.__mermaidInit) return;
  const nodes = [...document.querySelectorAll("#content .mermaid:not([data-processed])")];
  const valid = [];
  for (const node of nodes){
    try { await window.mermaid.parse(node.textContent); valid.push(node); }
    catch(e){ node.classList.remove("mermaid"); node.innerHTML = `<pre><code>${esc(node.textContent)}</code></pre>`; }
  }
  if (valid.length){ try { await window.mermaid.run({nodes: valid}); } catch(e){ console.warn("mermaid", e); } }
}
window.__mermaidOnload = () => { initMermaid(); renderMermaid(); };

function renderDrawer(){
  const o = state.open;
  $("#drawer").classList.remove("hidden");
  $("#fname").textContent = o.name;
  $("#fpath").textContent = o.abs;
  $("#fmeta").innerHTML = [
    srcBadge(o.s),
    `<span>${fmtBytes(o.size)}</span>`,
    o.created ? metaWhen("Criado", o.created) : "",
    metaWhen("Modificado", o.mtime),
    o.owner ? `<span>Dono: ${esc(o.owner)}${o.group && o.group !== o.owner ? " · grupo " + esc(o.group) : ""}</span>` : "",
    o.git ? `<span title="último commit neste arquivo (${esc(o.git.email)} ${esc(o.git.date)})">Git: ${esc(o.git.author)} · ${fmtDT(Date.parse(o.git.date))} · ${esc(o.git.sha)}</span>` : "",
    o.truncated ? `<span style="color:var(--warn)">exibindo primeiros 400 KB</span>` : "",
  ].join("");
  const isImage = /\.(png|jpe?g|gif|webp|ico|svg)$/i.test(o.r);
  const isBinaryImage = isImage && !/\.svg$/i.test(o.r);
  const canRender = isImage || /\.(md|markdown|jsonc?)$/i.test(o.r);
  $("#btn-render").style.display = canRender ? "" : "none";
  $("#btn-raw").style.display = canRender && !isBinaryImage ? "" : "none";
  $("#btn-render").style.outline = state.mode==="render" ? "1px solid var(--accent)" : "none";
  $("#btn-raw").style.outline = state.mode==="raw" ? "1px solid var(--accent)" : "none";
  const el = $("#content");
  if (isImage && state.mode === "render"){
    el.innerHTML = `<img class="preview" alt="${esc(o.name)}" src="/api/raw?s=${encodeURIComponent(o.s)}&r=${encodeURIComponent(o.r)}">`;
  } else if (state.mode === "raw" || !canRender){
    el.innerHTML = `<pre class="raw">${esc(o.content)}</pre>`;
  } else if (/\.jsonc?$/i.test(o.r)){
    el.innerHTML = `<pre class="raw">${esc(tryPretty(o.content))}</pre>`;
  } else {
    el.innerHTML = `<div class="md">${md(o.content)}</div>`;
  }
  el.scrollTop = 0;
  renderMermaid();
}

function tryPretty(text){
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch(e){}
  try { return JSON.stringify(JSON.parse(stripJsonc(text)), null, 2); } catch(e){}
  return text;
}

function stripJsonc(text){
  let out = "", i = 0, inStr = false;
  while (i < text.length){
    const c = text[i];
    if (inStr){
      out += c;
      if (c === "\\"){ out += text[i+1] ?? ""; i += 2; continue; }
      if (c === '"') inStr = false;
      i++; continue;
    }
    if (c === '"'){ inStr = true; out += c; i++; continue; }
    if (c === "/" && text[i+1] === "/"){ while (i < text.length && !"\n\r".includes(text[i])) i++; continue; }
    if (c === "/" && text[i+1] === "*"){ i += 2; while (i+1 < text.length && !(text[i] === "*" && text[i+1] === "/")) i++; i += 2; continue; }
    if (c === ","){ let j = i+1; while (j < text.length && " \t\r\n".includes(text[j])) j++; if ("}]".includes(text[j])){ i++; continue; } }
    out += c; i++;
  }
  return out;
}

function inline(raw){
  let s = esc(raw);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  return s;
}

function md(text){
  const lines = String(text).replace(/\r\n/g,"\n").split("\n");
  let out = "", i = 0;
  if (lines[0] === "---"){
    const end = lines.indexOf("---", 1);
    if (end > 0){ out += `<pre class="fm">${esc(lines.slice(1,end).join("\n"))}</pre>`; i = end+1; }
  }
  let para = [], list = null, fence = null, buf = [];
  const flushPara = () => { if (para.length){ out += "<p>"+inline(para.join(" "))+"</p>"; para = []; } };
  const flushList = () => { if (list){ out += "</"+list+">"; list = null; } };
  const flushFence = () => {
    if (fence === "mermaid") out += `<div class="mermaid">${esc(buf.join("\n"))}</div>`;
    else out += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>";
    buf = []; fence = null;
  };
  for (; i < lines.length; i++){
    const l = lines[i];
    if (fence !== null){ if (/^```/.test(l)) flushFence(); else buf.push(l); continue; }
    if (/^```/.test(l)){ flushPara(); flushList(); fence = ((l.match(/^```(\w*)/)||[])[1]||"").toLowerCase(); continue; }
    if (!l.trim()){ flushPara(); flushList(); continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ flushPara(); flushList(); const h = m[1].length; out += `<h${h}>${inline(m[2])}</h${h}>`; continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(l)){ flushPara(); flushList(); out += "<hr>"; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)){
      flushPara(); flushList();
      const rows = []; let j = i;
      while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])){ rows.push(lines[j]); j++; }
      i = j-1;
      const cells = (r) => r.trim().replace(/^\||\|$/g,"").split("|").map((c)=>c.trim());
      if (rows.length >= 2 && /^[\s:|-]+$/.test(rows[1])){
        out += "<table><thead><tr>"+cells(rows[0]).map((c)=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>";
        for (let k = 2; k < rows.length; k++) out += "<tr>"+cells(rows[k]).map((c)=>`<td>${inline(c)}</td>`).join("")+"</tr>";
        out += "</tbody></table>";
      }
      continue;
    }
    if ((m = l.match(/^>\s?(.*)$/))){ flushPara(); flushList(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){ flushPara(); if (list !== "ul"){ flushList(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushPara(); if (list !== "ol"){ flushList(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    para.push(l.trim());
  }
  flushPara(); flushList(); if (fence !== null && buf.length) flushFence();
  return out;
}

function refTarget(ref){
  const [kind, idx] = ref.split(":");
  const i = Number(idx);
  if (kind === "file") return state.files[i];
  if (kind === "skill") return state.catalog.skills[i];
  if (kind === "sr") return state.results[i];
  return null;
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav){ go(nav.dataset.nav); return; }
  const chip = e.target.closest("[data-tool]");
  if (chip){ state.tool = chip.dataset.tool; render(); renderNav(); return; }
  const ref = e.target.closest("[data-ref]");
  if (ref){
    const t = refTarget(ref.dataset.ref);
    if (t) openFile(t.s, t.r, t.n);
  }
});

$("#refresh").addEventListener("click", loadCatalog);
$("#btn-close").addEventListener("click", closeDrawer);
$("#backdrop").addEventListener("click", closeDrawer);
$("#drawer").addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){ if (!$("#drawer").classList.contains("hidden")) closeDrawer(); else if (state.view === "search") go("dashboard"); }
  if (e.key === "/" && document.activeElement !== $("#search")){ e.preventDefault(); $("#search").focus(); }
});
$("#btn-render").addEventListener("click", () => { state.mode = "render"; renderDrawer(); });
$("#btn-raw").addEventListener("click", () => { state.mode = "raw"; renderDrawer(); });
$("#btn-copy").addEventListener("click", async () => {
  if (!state.open) return;
  try { await navigator.clipboard.writeText(state.open.abs); toast("Caminho copiado"); }
  catch(e){ toast("Não foi possível copiar"); }
});
$("#btn-reveal").addEventListener("click", async () => {
  if (!state.open) return;
  await fetch("/api/reveal", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({s: state.open.s, r: state.open.r})});
});

let searchTimer;
$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("#search").value.trim();
  if (q.length < 2){ if (state.view === "search") go(state.lastView || "dashboard"); return; }
  searchTimer = setTimeout(async () => {
    state.query = q;
    state.results = await (await fetch("/api/search?q="+encodeURIComponent(q))).json();
    state.view = "search";
    render();
  }, 250);
});

history.replaceState({view: state.view, cat: state.cat, file: null}, "");
loadCatalog();
</script>
